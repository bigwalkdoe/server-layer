# Shared server configuration, included by both the HTTP and HTTPS server
# blocks in conf.d/default.conf.
#
# The security headers are declared once, here. A location that used its own
# `add_header` would stop inheriting these — nginx replaces the whole header set
# rather than merging it — so no location below adds headers of its own.

root /usr/share/nginx/html;

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Liveness for the nginx container only.
#
# /health is deliberately NOT answered here. A canned 200 in nginx would hide a
# dead backend from every health checker on the internet-facing side.
location = /healthz {
    access_log off;
    return 200 "ok\n";
}

# The landing page is a static file. The exact match wins over `location /`
# without relying on the index module's internal redirect.
location = / {
    try_files /index.html =404;
}

location /static/ {
    expires 30d;
}

location / {
    try_files $uri @app;
}

# Fallback: anything with no file on disk is an API request.
location @app {
    proxy_pass http://app_backend;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;
}
