upstream app_backend {
    server app:3000;
    keepalive 16;
}

# Plain HTTP. Serves the stack directly rather than redirecting to HTTPS.
#
# A correct redirect needs the *external* port, and nginx cannot derive it from
# the internal one — this stack publishes 8443 on the host, so a naive
# `return 301 https://$host$request_uri` would send clients to port 443 and
# break. Serving both keeps the container healthcheck and local tooling simple.
# For a single-port deployment, replace this server block with:
#
#     server {
#         listen 80;
#         server_name _;
#         location = /healthz { access_log off; return 200 "ok\n"; }
#         location / { return 301 https://$host$request_uri; }
#     }
server {
    listen 80;
    server_name localhost;

    include /etc/nginx/snippets/server.conf;
}

# TLS. The certificate is the self-signed development one produced by
# ./gen-dev-cert.sh (mounted from configs/nginx/certs). Replace it with a real
# certificate before exposing this stack to anything.
server {
    listen 443 ssl;
    http2 on;
    server_name localhost;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    include /etc/nginx/snippets/server.conf;
}
