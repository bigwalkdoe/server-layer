# Server Layer Logrotate Configuration
# Place this in /etc/logrotate.d/server-layer or use with: logrotate -f configs/logrotate.conf

../logs/*.log {
    daily
    rotate 7
    compress
    delaycompress
    missingok
    notifempty
    create 0644 bwd bwd
    sharedscripts
    postrotate
        # Add any post-rotation commands here
    endscript
}
